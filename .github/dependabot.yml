version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      github-actions:
        patterns:
          - "actions/*"

  # Base-image bumps (debian:trixie-slim digest moves).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
